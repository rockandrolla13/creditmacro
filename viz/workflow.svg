<text x="138" y="238" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#2B3138">WIKI MEMORY</text>
<text x="138" y="258" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">method pages (how to reason)  ·  case pages (past themes/outcomes)</text>
