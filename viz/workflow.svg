<text x="138" y="1262" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">Q10 size (Alaph grid) · Q11 stop (on the axis) · Q12 falsifiers (observable+threshold)</text>
<rect x="120" y="1324" width="760" height="60" rx="10" fill="#FBE9E9" stroke="#C0392B" stroke-width="2"/>
<text x="138" y="1348" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#5A1812">PM GATE</text>
<text x="138" y="1368" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">Q13 open questions  →  STOP · hands control to the human (epistemic engine ends here)</text>
<rect x="120" y="1438" width="760" height="96" rx="10" fill="#EAEEF2" stroke="#5B6B7B" stroke-width="2"/>
<text x="138" y="1462" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#22303C">THESIS TRACKER  (SQLite sidecar — standalone)</text>
<text x="138" y="1482" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">one row per ticker · computes probability-weighted price + upside · audit log</text>
<text x="138" y="1500" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">seeded by create_thesis_stub_from_theme() — copies thesis/links/kill-criteria,</text>
<text x="138" y="1518" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">invents NO prices, probabilities, weights, or recommendations</text>
