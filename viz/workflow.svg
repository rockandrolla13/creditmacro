<text x="500.0" y="512" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10.5" fill="#5A4410">Phase A — fresh reasoning, METHOD pages only   ▶   FREEZE (SHA-256 snapshot)   ▶   Phase B — CASE pages: analogue + calibration only</text>
<rect x="120" y="566" width="760" height="92" rx="10" fill="#E8F5EC" stroke="#3A9D5D" stroke-width="2"/>
<text x="138" y="590" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#163E27">ENGINE 1 — Driver + Axis</text>
<text x="138" y="610" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">Q1 theme · Q2 universe · Q3 operational axis (a named, computable series)</text>
