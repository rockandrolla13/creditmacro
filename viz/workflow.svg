<text x="500.0" y="48" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="800" fill="#11181F">Theme-to-Trade Engine — Workflow</text>
<text x="500.0" y="74" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#5A636C">A disciplined, falsifiable pipeline: research → causal theme → priced-in edge → ranked strategy families → PM decision. Chips = method skills (firewall-safe).</text>
<rect x="120" y="108" width="760" height="60" rx="10" fill="#EEF1F4" stroke="#94A0AB" stroke-width="2"/>
<text x="138" y="132" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#2B3138">RAW SOURCES  (immutable)</text>
<text x="138" y="152" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">markdowns/ · research books · papers — never modified</text>
