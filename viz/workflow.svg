<text x="138" y="364" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">Observation (facts) · CandidateTheme (narratives) · ConsensusSignal (attention)</text>
<text x="138" y="382" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">nominate themes RANKED BY divergence(evidence, attention) = pre-screen on (p − q)</text>
