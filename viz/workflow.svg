<text x="138" y="1136" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#2B3138">ENGINE 3 — Expression Scoring</text>
<text x="138" y="1156" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">Q8 candidates · Q9 best = gated score ρ²·Ω·(1+a·cvx)·liq·e^(−g·crowd)/(1+cap)</text>
