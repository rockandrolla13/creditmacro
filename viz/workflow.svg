<text x="138" y="728" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0E3F3B">ENGINE 2 — Scenario Pricing</text>
<text x="138" y="748" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" fill="#3A424B">Q4 normal FV · Q5 scenario FV = Σ pₛ Xₛ · Q6 priced-in q (max-entropy) · Q7 edge = ⟨p − q, X⟩</text>
