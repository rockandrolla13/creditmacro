risk:
  stop_loss:
    level: 20.0
    rationale: Differential compressing below 20bps falsifies the support-withdrawal
      thesis.
  falsifiers:
  - observable: French-banks − France senior CDS differential (bps)
    threshold: 20.0
    kill_rule: If the differential falls below 20bps, sovereign support is re-pricing
      IN; thesis dead.
  - observable: EU bank state-aid commitments (EUR bn, rolling)
    threshold: 50.0
    kill_rule: If fresh state-aid backstops exceed EUR 50bn, the no-support driver
      is invalid.
  invalidation_horizon: 2Y
  max_loss: -250000.0
pm_gate:
  open_questions:
  - Confirm the live differential vs the 40bps entry; rerun the q solver if it has
    moved.
  - Confirm basket liquidity supports $25mm beta-neutral sizing.
  - Is the 20% no-support tail probability defensible vs the 8% historical frequency?
    (this is where the edge comes from)
