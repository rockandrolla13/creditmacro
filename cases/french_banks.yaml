# French-banks case — reconstructed from the Alaph deck (acceptance oracle).
# axis = FR-banks-basket senior CDS - France sovereign CDS; prior=historical.
# Carries causal chain + system_map + bias_critique + loop_diagnosis(pre) + trap_implications(post).
theme_sentence: Declining sovereign support widens French-bank vs France credit risk
horizon: 2Y
author: engine.fixtures (French-banks reconstruction)
thesis:
  drivers:
  - name: Sovereign support withdrawal
    sign: +
    proxy_observable: EU state-aid / bail-in policy stance (qualitative index)
    current_level: null
    mechanism: Reduced willingness to backstop banks raises bank risk premium vs sovereign.
    edge_elasticity: null
  - name: Bank peripheral-sovereign exposure
    sign: +
    proxy_observable: French banks' GIIPS sovereign holdings (EBA, EUR bn)
    current_level: null
    mechanism: Peripheral exposure + downgrade pressure widens bank CDS vs France.
    edge_elasticity: null
  - name: Basel 3 deleveraging
    sign: +
    proxy_observable: French banks core tier-1 shortfall to Basel-3 (EUR bn)
    current_level: null
    mechanism: Forced deleveraging/funding-term extension pressures bank credit.
    edge_elasticity: null
  causal_chain:
  - from_node: Sovereign support withdrawal
    to_node: French bank senior CDS
  - from_node: Bank peripheral-sovereign exposure
    to_node: French bank senior CDS
  - from_node: French bank senior CDS
    to_node: FR banks − France differential
  direction_of_view: French-banks − France senior CDS differential WIDENS from ~40bps
  driver_diversification_multiplier: null
axis:
  definition: French-banks-basket senior CDS − French sovereign CDS, bps. Basket =
    equal-weighted 5Y senior CDS on BNP Paribas, Societe Generale, Credit Agricole;
    sovereign = 5Y France CDS, traded beta-neutral.
  measurement: 5Y on-the-run senior CDS mid, daily close; trade index = basket spread
    − beta·sovereign spread.
  current_value: 40.0
  history:
    mean: 70.0
    vol: 30.0
    percentile: 10.0
    regime_tags:
    - European sovereign crisis 2010-2011
  regime: null
