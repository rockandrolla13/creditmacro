    why_it_matters: the differential lags the structural change — the surprise window
  external_shocks:
  - a Dexia-style bailout
  - sovereign downgrade
  - euro-area growth shock
  internal_responses:
  - the differential widens as risk shifts to banks
  - or snaps tighter on a bailout
  observable_variables:
  - FR-banks basket senior CDS − France sovereign CDS (bps)
  - German/UK bank-vs-sovereign differentials (cross-section)
  surprise_modes:
  - a sudden full bailout snaps the differential tighter (B1 dominates)
  - support withdrawal cascades faster than spreads price (R1, delayed)
bias_critique:
  dominant_mental_model: the sovereign always backstops systemic banks (support is
    permanent)
  alternative_models:
  - sovereign support is being withdrawn (the thesis)
  - the differential is a fair risk premium, not a mispricing
  - 'mean-reversion: the differential snaps back to its historical low'
  assumptions_treated_as_facts:
  - the ~40bps differential is anchored near its historical low
  - French banks are more liquid than Spanish/Italian peers
  lenses_examined:
  - fundamental
  - technical/flow
  - liquidity
  - positioning
  - cross-asset
  - time-horizon
  - failure-mode
  disconfirming_evidence:
  - differential compresses below 20bps for two consecutive months
  - fresh EU state-aid backstops exceed EUR 50bn
  decision: accept_model
  rationale: declining-support thesis survives >=5 lenses; edge is net of the standing
    risk-premium confounder and cross-checked vs Germany/UK; the reflexive bailout
    loop is the main risk, captured as B1
loop_diagnosis:
  feedback_loop_map:
  - id: B1
    type: balancing
    path:
    - n_diff
    - n_support
    delay: months
    closes_via: a wide differential pressures the state to intervene, tightening it
  - id: R1
    type: reinforcing
    path:
    - n_support
    - n_exposure
    - n_diff
    delay: quarters
    closes_via: withdrawn support raises bank risk, widening the differential, eroding
      confidence
  dominant_loop_now: R1 (reinforcing) — withdrawn support widens the differential
  dominant_loop_evidence: differential elevated vs its historical low; support narrative
    deteriorating
  possible_loop_shift: a Dexia-style bailout flips R1->B1, snapping the differential
    tighter (the reversal point)
  system_traps:
  - escalation if peers' differentials widen in sympathy
  - success-to-the-successful if the short-bank trade crowds and masks fragility
  leverage_points:
  - description: EU state-aid / bail-in policy stance
    observable: true
  - description: the implicit sovereign-support guarantee itself (structural)
    observable: false
  early_warning_indicators:
  - state-aid announcements (EUR bn)
  - differential compressing back toward 20bps off the wides
  - German/UK bank-vs-sovereign differentials converging
  invalidation_evidence:
  - differential < 20bps for two consecutive months
  - fresh EU state-aid backstops > EUR 50bn
  pm_questions:
  - is the edge net of the standing risk premium (gross-of-premium today)?
  - are we positioned before or after the reflexive bailout loop?
  decision: promote_to_scenario_pricing
trap_implications:
  scenario_implications:
  - the worst/no-support state carries the widening edge
  - a bailout state is the balancing-loop reversal that caps it
  expression_risk_implications:
  - long-the-differential / short-French-banks dies first on a bailout snap
  - carry/flatteners next; convex long-protection survives
