    threshold: 150.0
    kill_rule: If 30Y AI-issuer YTD supply falls below $150bn, the supply-surge driver
      is invalid; thesis is dead.
  - observable: LDI inflows to 20Y+ IG (EPFR, $bn/month)
    threshold: 8.0
