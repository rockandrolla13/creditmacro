theme_sentence: AI issuance will steepen IG credit curves
horizon: 6–12 months
author: engine.example (prototype)
thesis:
  drivers:
  - name: AI supply surge
    sign: +
    proxy_observable: Bloomberg BICS Tech sector net IG issuance, 30Y tenor, YTD ($bn)
    current_level: 185.0
    mechanism: Surge in 30Y AI-issuer IG supply pressure-tests duration demand, requiring
      spread concessions at the long end.
    edge_elasticity: null
  - name: Duration demand mismatch
    sign: +
    proxy_observable: LDI inflows to 20Y+ IG ($bn/month, EPFR)
    current_level: null
    mechanism: LDI and insurance demand concentrated at 10–20Y, leaving 30Y paper
      price-sensitive; supply/demand gap widens 5s30s slope.
    edge_elasticity: null
  - name: Mean reversion from compressed slope
    sign: +
    proxy_observable: IG AI-issuer 5s30s OAS slope (bps, Bloomberg)
    current_level: 52.0
    mechanism: Current 52bps is 1.5σ below 3Y mean of 75bps; historical base rate
      of 15bps re-steepening within 6m is 70%.
    edge_elasticity: null
  causal_chain:
  - from_node: AI supply surge
    to_node: 30Y IG OAS
  - from_node: Duration demand mismatch
    to_node: 30Y IG OAS
  - from_node: 30Y IG OAS
    to_node: 5s30s OAS slope
  - from_node: Mean reversion from compressed slope
    to_node: 5s30s OAS slope
  direction_of_view: 5s30s OAS slope widens (steepens) from 52bps toward 70–95bps
  driver_diversification_multiplier: null
axis:
  definition: 'IG AI-issuer 5s30s OAS slope = OAS(30Y basket) − OAS(5Y basket), measured
    in bps. Universe: top-25 IG issuers by AI capex intensity per Bloomberg BICS Tech,
    min $1bn outstanding, OAS <= 300bps (exclude distressed).'
  measurement: 'Bloomberg: BVAL OAS for each name; 5Y tenor = 4.5–5.5Y maturity bucket;
    30Y tenor = 27–33Y maturity bucket; basket is par-weighted by outstanding notional.
    Daily close, 16:00 EST.'
  current_value: 52.0
  history:
